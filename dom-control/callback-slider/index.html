<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@14.0.1/swiper-bundle.min.css"
    />
    <link rel="stylesheet" href="./css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/swiper@14.0.1/swiper-bundle.min.js"></script>
    <script defer src="./js/app.js"></script>
  </head>

  <body>
    <div id="wrap">
      <div class="bg-wrap">
        <ul>
          <li class="bg1"></li>
          <li class="bg2"></li>
          <li class="bg3"></li>
          <li class="bg4"></li>
        </ul>
      </div>
      <div class="gallery-wrap">
        <div class="swiper gallery">
          <div class="swiper-wrapper">
            <div class="swiper-slide s01">
              <h2>title1</h2>
            </div>
            <div class="swiper-slide s02">
              <h2>title2</h2>
            </div>
            <div class="swiper-slide s03">
              <h2>title3</h2>
            </div>
            <div class="swiper-slide s04">
              <h2>title4</h2>
            </div>
          </div>
          <div class="btn-wrap">
            <button type="button" class="btn prev">prev</button>
            <button type="button" class="btn next">next</button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
